services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-storefront}
    ports:
      # Loopback only: lets host-side tools (pytest, psql) reach it without exposing it.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-storefront}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Same-origin behind nginx, so no CORS is needed; production also disables the CORS middleware.
      ENV: ${ENV:-production}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-storefront}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN in .env (from @BotFather)}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in .env to a long random string}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      SHIPPING_FLAT_RATE: ${SHIPPING_FLAT_RATE:-4.99}
      FREE_SHIPPING_THRESHOLD: ${FREE_SHIPPING_THRESHOLD:-50.00}
      # Courier delivery. An empty webhook secret keeps POST /webhooks/telegram switched off (404).
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      WEBAPP_URL: ${WEBAPP_URL:-}
      MAX_ACTIVE_DELIVERIES_PER_COURIER: ${MAX_ACTIVE_DELIVERIES_PER_COURIER:-3}
      LOCATION_STALE_SECONDS: ${LOCATION_STALE_SECONDS:-120}
      # Admin panel
      ADMIN_BOOTSTRAP_TELEGRAM_IDS: ${ADMIN_BOOTSTRAP_TELEGRAM_IDS:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?set ADMIN_SESSION_SECRET in .env to a long random string}
      SHOP_TIMEZONE: ${SHOP_TIMEZONE:-UTC}
      LOW_STOCK_THRESHOLD: ${LOW_STOCK_THRESHOLD:-5}
      # Stock reservation: unpaid orders expire after the TTL and return their items to the cart.
      RESERVATION_TTL_MINUTES: ${RESERVATION_TTL_MINUTES:-15}
      RESERVATION_SWEEP_SECONDS: ${RESERVATION_SWEEP_SECONDS:-60}
      # Telegram notifications: queued messages are sent every this many seconds (0 = off).
      NOTIFICATION_SEND_SECONDS: ${NOTIFICATION_SEND_SECONDS:-2}
      MEDIA_ROOT: /data/media
    volumes:
      - media:/data/media
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: ./frontend
      args:
        # VITE_* values are baked into the bundle at build time (they are public by design).
        VITE_API_BASE_URL: /api
        VITE_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
        VITE_MAP_TILE_URL: ${MAP_TILE_URL:-}
        VITE_MAP_DEFAULT_CENTER: ${MAP_DEFAULT_CENTER:-}
        VITE_MAP_ATTRIBUTION: ${MAP_ATTRIBUTION:-}
        VITE_TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - media:/usr/share/nginx/media:ro
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pgdata:
  media:
