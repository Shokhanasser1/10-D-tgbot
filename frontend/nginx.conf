server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;

  # Same-origin API: the SPA calls /api/*, so the browser needs no CORS. The trailing
  # slash on proxy_pass strips the /api prefix. Stripe webhooks arrive here too
  # (POST /api/webhooks/stripe) with the raw body untouched, as signature checks require.
  location /api/ {
    # Product photos are uploaded through here (the API accepts up to 10 MB per image).
    client_max_body_size 11m;
    proxy_pass http://api:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Uploaded product photos, from the volume the API writes to. Names are random and never
  # reused, so they cache forever. Only .webp is served: that is all the API ever writes.
  location ~ ^/media/(products/[0-9a-f]+\.webp)$ {
    alias /usr/share/nginx/media/$1;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
  }
  location /media/ {
    return 404;
  }

  # Hashed build assets never change, so cache them hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # SPA fallback: client-side routes (/cart, /orders/12, ...) all serve index.html, which
  # must not be cached so a new deploy is picked up immediately.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri /index.html;
  }
}
