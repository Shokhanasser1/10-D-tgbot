server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;

  # Same-origin API: the SPA calls /api/*, so the browser needs no CORS. The trailing
  # slash on proxy_pass strips the /api prefix. Stripe webhooks arrive here too
  # (POST /api/webhooks/stripe) with the raw body untouched, as signature checks require.
  location /api/ {
    proxy_pass http://api:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed build assets never change, so cache them hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # SPA fallback: client-side routes (/cart, /orders/12, ...) all serve index.html, which
  # must not be cached so a new deploy is picked up immediately.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri /index.html;
  }
}
